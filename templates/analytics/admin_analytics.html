<div class="stats-grid">
    <div class="stat-card">
        <h3>Total Appointments</h3>
        <p class="stat-number">{{ total_appointments }}</p>
    </div>
    <div class="stat-card">
        <h3>Completion Rate</h3>
        <p class="stat-number">{{ completion_rate }}%</p>
    </div>
    <div class="stat-card">
        <h3>No-Show Rate</h3>
        <p class="stat-number">{{ no_show_rate }}%</p>
    </div>
    <div class="stat-card">
        <h3>Slot Utilization</h3>
        <p class="stat-number">{{ utilization_rate }}%</p>
    </div>
</div>
